# coredevs service configuration.
#
# Each team maps onto upstream datasources. The API returns the superset of
# handles across the sources configured for a team.

http:
  addr: ":8080"

# How often the datasources are refreshed.
syncInterval: 3h

# Last-good index persisted here between restarts. Mounted from a PVC in k8s.
snapshotPath: /data/index.json

sources:
  protocolGuild:
    enabled: true
    url: https://raw.githubusercontent.com/protocolguild/documentation/main/docs/01-membership.md
    # Sanity floor: if a parse yields fewer than this many members (e.g. the
    # upstream markdown format changed), keep the last good result instead of
    # publishing a gutted index. The document currently has ~190 members.
    minMembers: 50
    # Second sanity floor, on how many distinct teams the parse spans. A member
    # count alone cannot catch a section rename, which keeps the total healthy
    # while collapsing everyone onto whichever few headers still match. The
    # registry currently maps 23 sections.
    minTeams: 15
    # How many configured protocolGuildSections may be absent from the document
    # before the fetch is rejected. A header that disappears strands everyone
    # under it, so this catches an upstream rename directly instead of inferring
    # it from the counts afterwards. Missing headers are always logged and
    # exported as coredevs_source_warnings, whether or not they trip this.
    maxMissingSections: 3
  githubOrg:
    enabled: true
    baseURL: https://api.github.com
    # Optional token (lifts the unauthenticated rate limit). Read from this env var.
    tokenEnv: GITHUB_TOKEN
    minMembers: 0

# GitHub SSH public-key cache. A rate-paced proxy that fetches each indexed
# developer's keys (github.com/<handle>.keys) in the background, so consumers
# read a team's authorized_keys from coredevs without ever calling GitHub.
#
# Pacing — "don't hammer GitHub, but don't take forever": a single walker fetches
# one handle at a time, with the delay between fetches derived as
#   delay = max(refreshInterval / handleCount, 1 / maxRequestsPerSecond)
# The set is spread evenly across refreshInterval (so a handle is refreshed about
# once per window), while maxRequestsPerSecond caps the burst rate. With ~300
# handles and a 3h window that's one request every ~36s — ~0.03 req/s.
keys:
  enabled: true
  baseURL: https://github.com
  # Target staleness: a full pass completes about once per this window, so a key
  # change shows up within it. Lower for fresher keys; the RPS ceiling below
  # still protects GitHub.
  refreshInterval: 1h
  # Hard ceiling on the upstream request rate.
  maxRequestsPerSecond: 5
  # Per-handle key cache directory (one file per developer). Used only by the
  # writer (readers serve from Postgres); empty disables persistence.
  cacheDir: /data/keys

# Multi-pod coordination. coredevs holds no authoritative state, so to serve
# from many pods without split brain a single writer publishes one snapshot row
# to Postgres and many readers load it — every pod serves identical data.
#
# role is set per pod by the --role flag (the writer/reader Deployments pass it),
# since the config is baked into one image. Default standalone needs no Postgres.
cluster:
  role: standalone # overridden to writer/reader in k8s
  postgres:
    # Env var holding the Postgres connection string (injected from a secret).
    dsnEnv: COREDEVS_DATABASE_URL
    # How often the writer publishes a fresh snapshot.
    publishInterval: 15s
    # How often a reader polls Postgres for a new snapshot. Bounds cross-pod skew;
    # the data changes slowly so a few seconds is plenty.
    refreshInterval: 5s

# Canonical team registry.
#
# protocolGuildSections: team headers in the Protocol Guild document, written
#   exactly as they appear there minus the "- N Members" suffix the document
#   appends to each one (e.g. "Teku (Consensys)", "Lighthouse (Sigma Prime)").
#   This is the precise per-client signal and the default basis for the superset.
# githubOrgs: orgs whose PUBLIC members are folded into this team's superset.
#   Left empty by default: the obvious candidate orgs are whole-company orgs
#   (Consensys, OffchainLabs, ChainSafe, status-im, NethermindEth, ...) whose
#   public membership is far broader than the client dev team — wiring them in
#   pollutes the superset with unrelated employees. Opt an org in once its
#   membership is close enough to the team, or when a deliberately wide roster
#   beats missing developers the other sources don't list. Any org can always be
#   queried ad-hoc, without wiring, via GET /api/v1/orgs/{org}/members.
#
# Candidate orgs per team are noted in comments for when you choose to opt in.
# kind groups teams by role so consumers can filter (e.g. /api/v1/teams?kind=client):
#   client | research | coordination | delivery
# GitHub handles dropped from every team regardless of source — for stale handles
# an upstream still lists (renamed/deleted accounts whose key fetches 404).
exclude:
  - somnathb1 # renamed/deleted; the dev is now somnergy (added to erigon members)

